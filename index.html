<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>GBA / GBC / GB Player</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }
        #game-container {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="game"></div>
    </div>

    <script type="text/javascript">
        EJS_player = '#game';
        EJS_core = 'gb'; 
        EJS_gameUrl = 'https://raw.githubusercontent.com/laguaridadeldragonstore/PKMN/main/PKMN-R.gb';
        EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';

        // --- OPTIMIZACIONES DE AUDIO Y RENDIMIENTO ---
        
        // 1. Activa la aceleración por hilos (Worker) para que la CPU gestione mejor el audio
        EJS_threads = true;

        // 2. Desactiva la sincronización estricta de FPS si el teléfono fuerza 90Hz/120Hz
        EJS_smooth = false;

        // 3. Configuración para evitar tirones en móviles
        EJS_gameName = 'Pokemon Red';
    </script>
    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
