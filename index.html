<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>GBA / GBC / GB Player</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }
        #game-container {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="game"></div>
    </div>

    <script type="text/javascript">
        // 1. Obtener los valores pasados desde la URL del NFC
        const urlParams = new URLSearchParams(window.location.search);
        
        // Lee el core indicado en la URL (si no hay ninguno, usa 'gb' por defecto)
        const coreParam = urlParams.get('core') || 'gb'; 

        // Lee la ruta de la ROM en la URL (si no hay ninguna, carga la por defecto)
        const romParam = urlParams.get('rom') || 'PKMN/PKMN-R.gb';

        // 2. Construir la URL completa de la ROM
        let finalGameUrl = romParam;
        
        // Si no es un enlace completo, le anteponemos la base de GitHub Raw
        if (!romParam.startsWith('http://') && !romParam.startsWith('https://')) {
            finalGameUrl = 'https://raw.githubusercontent.com/laguaridadeldragonstore/' + romParam;
        }

        // 3. Configurar EmulatorJS
        EJS_player = '#game';
        EJS_core = coreParam;       // Se asigna el core manual
        EJS_gameUrl = finalGameUrl; // Se asigna la ROM manual
        EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
    </script>
    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
